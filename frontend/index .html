<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Frontend</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      width: 300px;
    }

    input {
      width: 90%;
      padding: 10px;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 20px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
    }

    .response {
      margin-top: 15px;
      color: green;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Frontend</h2>

    <input id="message" type="text" placeholder="Enter message" />
    <br />
    <button onclick="sendData()">Send</button>

    <div class="response" id="response"></div>
  </div>

  <script>
    async function sendData() {
      const message = document.getElementById("message").value;

      try {
        const res = await fetch("https://deployment-1-ntig.onrender.com", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message })
        });

        const data = await res.json();
        document.getElementById("response").innerText = JSON.stringify(data);
      } catch (err) {
        document.getElementById("response").innerText = "Error connecting to backend";
      }
    }
  </script>

</body>
</html>
